<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada · EspunyDesign</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-md);
            gap: var(--space-md);
        }
        .not-found__code {
            font-family: var(--font-primary);
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 300;
            color: var(--color-text-muted);
            letter-spacing: -0.02em;
        }
        .not-found__text {
            color: var(--color-text-light);
            font-weight: 300;
            max-width: 420px;
        }
        .not-found__links {
            display: flex;
            gap: var(--space-md);
            margin-top: var(--space-sm);
        }
    </style>
</head>
<body>
    <div class="not-found">
        <img src="/assets/img/logo-mark.png" alt="EspunyDesign" width="64" height="64">
        <p class="not-found__code">404</p>
        <p class="not-found__text">Esta página no existe o se ha movido. / Aquesta pàgina no existeix o s'ha mogut. / This page doesn't exist or has moved.</p>
        <div class="not-found__links">
            <a href="/" class="btn btn--primary">ES</a>
            <a href="/ca/" class="btn btn--primary">CA</a>
            <a href="/en/" class="btn btn--primary">EN</a>
        </div>
    </div>
</body>
</html>
